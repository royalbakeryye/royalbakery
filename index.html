<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Royal Bakery | المخبز الملكي</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #fdfaf5;
            --primary-orange: #f38230;
            --dark-black: #1a1a1a;
            --white: #ffffff;
            --gold: #d4a017;
            --whatsapp-green: #25d366;
            --red: #e74c3c;
            --gray: #f0f0f0;
            --soft-shadow: 0 10px 30px rgba(0,0,0,0.08);
            --luxury-gradient: linear-gradient(135deg, #f38230 0%, #d4a017 100%);
        }

        body {
            margin: 0; background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding-bottom: 120px; color: var(--dark-black);
            -webkit-tap-highlight-color: transparent;
        }

        /* واجهة المتجر مغلق */
        #closed-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(26, 26, 26, 0.98); z-index: 10000;
            display: none; flex-direction: column; justify-content: center;
            align-items: center; color: white; text-align: center; padding: 30px;
            backdrop-filter: blur(10px);
        }

        header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px); padding: 20px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 2px 20px rgba(0,0,0,0.03);
            position: sticky; top: 0; z-index: 1000;
        }

        .logo { font-size: 22px; font-weight: 900; color: var(--dark-black); letter-spacing: 1px; }
        .logo span { color: var(--gold); }

        .categories-nav {
            display: flex; gap: 12px; padding: 15px; overflow-x: auto;
            background: var(--white); border-bottom: 1px solid #f0f0f0;
            position: sticky; top: 65px; z-index: 999; scrollbar-width: none;
        }
        .categories-nav::-webkit-scrollbar { display: none; }

        .cat-btn {
            background: #fff; border: 1px solid #eee; padding: 10px 25px;
            border-radius: 50px; cursor: pointer; white-space: nowrap; 
            font-weight: 600; transition: 0.4s; font-size: 14px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }
        .cat-btn.active { 
            background: var(--luxury-gradient); color: white; 
            border-color: transparent; box-shadow: 0 8px 15px rgba(243, 130, 48, 0.3); 
        }

        .products-container {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 20px; padding: 20px; max-width: 1100px; margin: 0 auto;
        }

        .card {
            background: var(--white); border-radius: 25px; padding: 15px;
            text-align: center; box-shadow: var(--soft-shadow);
            transition: all 0.3s ease; border: 1px solid rgba(0,0,0,0.02);
            position: relative; overflow: hidden;
        }
        .card:hover { transform: translateY(-8px); box-shadow: 0 15px 35px rgba(0,0,0,0.12); }

        .product-img { width: 100%; height: 140px; object-fit: cover; border-radius: 20px; background: #fdfdfd; cursor: zoom-in; transition: 0.3s; }
        .product-title { font-weight: 700; margin: 12px 0 5px; font-size: 15px; color: #333; }
        .rating { color: #ffc107; font-size: 12px; margin-bottom: 8px; }
        .product-price { color: var(--primary-orange); font-weight: 800; margin-bottom: 12px; font-size: 18px; }

        /* التعديل: جعل المنتج ظاهراً مع طبقة خفيفة جداً */
        .unavailable-tag {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.4); /* شفافية لظهور المنتج */
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 5; border-radius: 25px; pointer-events: none; /* للسماح بالنقر من خلالها */
        }
        .reason-box { background: var(--red); color: white; padding: 5px 12px; border-radius: 8px; font-size: 12px; font-weight: bold; margin-top: 5px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        
        /* تبهيت المنتج غير المتوفر قليلاً */
        .card.unavailable { opacity: 0.8; filter: grayscale(0.5); }

        .add-btn {
            background: var(--luxury-gradient); color: white; border: none;
            width: 100%; padding: 12px; border-radius: 15px; cursor: pointer; font-weight: bold;
            transition: 0.3s; box-shadow: 0 5px 15px rgba(243, 130, 48, 0.2);
        }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(5px);
            z-index: 2000; justify-content: center; align-items: flex-end;
        }

        .modal-content {
            background: white; width: 100%; max-width: 500px; border-radius: 35px 35px 0 0;
            padding: 30px; max-height: 85vh; overflow-y: auto; animation: slideUp 0.4s ease-out;
        }

        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .bottom-nav {
            position: fixed; bottom: 20px; left: 20px; right: 20px; 
            background: var(--dark-black); border-radius: 25px;
            display: flex; justify-content: space-between; align-items: center; 
            padding: 15px 25px; z-index: 1500; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        #imageViewer {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 3000; justify-content: center; align-items: center;
        }
        #fullImage { max-width: 90%; max-height: 80%; border-radius: 15px; border: 3px solid white; }

        /* تعديل زر الموقع مع أنيميشن الوميض */
        .location-btn {
            width: 100%; background: #fef2f2; color: var(--red); border: 2px dashed var(--red); 
            padding: 15px; border-radius: 15px; margin: 15px 0; cursor: pointer; font-weight: bold;
            transition: 0.3s;
        }
        
        .pulse-animation {
            animation: pulse-red 1.5s infinite;
        }

        @keyframes pulse-red {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.7); }
            70% { transform: scale(1.02); box-shadow: 0 0 0 10px rgba(231, 76, 60, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(231, 76, 60, 0); }
        }

        .location-btn.success { 
            background: #f0fdf4; color: #166534; border-style: solid; 
            border-color: #166534; animation: none; transform: scale(1); 
        }

        #status-dot { width: 10px; height: 10px; border-radius: 50%; background: #bbb; }
    </style>
</head>
<body>

<div id="closed-overlay">
    <div style="font-size: 70px; margin-bottom: 25px;">🌙</div>
    <h2 style="color: var(--primary-orange); font-size: 28px;">نعتذر، المتجر مغلق حالياً</h2>
    <p id="closed-reason" style="font-size: 18px; opacity: 0.8;"></p>
    <button onclick="location.reload()" style="margin-top:25px; padding:12px 30px; border-radius:15px; border:none; background:var(--luxury-gradient); color:white; font-weight:bold; cursor:pointer;">تحديث الحالة 🔄</button>
</div>

<header>
    <div class="logo">ROYAL <span>BAKERY</span> 👑</div>
    <div id="status-dot"></div>
</header>

<div class="categories-nav" id="catNav">
    <button class="cat-btn active" onclick="filterProducts('all', this)">✨ الكل</button>
</div>

<div id="loading" style="text-align:center; padding: 100px 0;">
    <div style="color: var(--gold); font-size: 18px; font-weight: bold;">جاري تحضير القائمة الملكية...</div>
</div>

<div class="products-container" id="products"></div>

<div id="imageViewer" onclick="closeImageViewer()">
    <img id="fullImage" src="">
</div>

<div class="bottom-nav">
    <div style="color: white;">الإجمالي: <span id="nav-total" style="color: var(--gold); font-weight: bold; font-size: 20px;">0</span> <small>ريال</small></div>
    <div onclick="toggleModal()" style="color: white; cursor: pointer; font-weight: bold; background: var(--luxury-gradient); padding: 12px 25px; border-radius: 18px;">
        🛒 السلة (<span id="nav-count">0</span>)
    </div>
</div>

<div id="cartModal" class="modal" onclick="closeCartOnOverlay(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h3 style="margin: 0; font-size: 22px;">سلة المشتريات 🛒</h3>
            <button onclick="toggleModal()" style="font-size: 32px; border: none; background: none; color: #ddd; cursor: pointer;">×</button>
        </div>
        
        <div id="cartItemsList"></div>

        <div style="margin-top: 25px;">
            <input type="text" id="custName" placeholder="اسمك الكريم" oninput="saveUserData()" style="width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #eee; margin-bottom: 10px; outline: none; box-sizing: border-box;">
            <input type="tel" id="custPhone" placeholder="رقم الجوال" oninput="saveUserData()" style="width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #eee; margin-bottom: 10px; outline: none; box-sizing: border-box;">
            
            <button id="getLocBtn" onclick="getLocation()" class="location-btn pulse-animation">📍 اضغط هنا لتحديد موقعك GPS</button>

            <textarea id="orderNotes" style="width: 100%; height: 80px; padding: 15px; border-radius: 12px; border: 1px solid #eee; outline: none; box-sizing: border-box; resize: none;" placeholder="أي ملاحظات إضافية؟"></textarea>
        </div>

        <div style="background: #fff9f5; padding: 20px; border-radius: 20px; margin: 20px 0; text-align: center; border: 1px solid #ffe0cc;">
            <div style="color: #2e7d32; font-weight: bold; font-size: 14px; margin-bottom: 8px;">🛵 التوصيل مجاني للجميع!</div>
            <span style="font-size: 20px; font-weight: 800;">الإجمالي: <span id="modalTotal" style="color:var(--primary-orange);">0</span> ريال</span>
        </div>

        <button id="sendOrderBtn" onclick="handleOrder()" style="background: var(--whatsapp-green); color: white; border: none; width: 100%; padding: 18px; border-radius: 20px; font-size: 18px; font-weight: bold; cursor: pointer;">تأكيد الطلب عبر الواتساب 💬</button>
        <button onclick="clearCart()" style="width: 100%; background: none; border: none; color: var(--red); margin-top: 20px; cursor: pointer; font-weight: 600;">🗑️ تفريغ السلة</button>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://gemnsdsexkbyfdpozcwu.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdlbW5zZHNleGtieWZkcG96Y3d1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY3NDgzNzcsImV4cCI6MjA4MjMyNDM3N30.QQt3zYL5rF4kr1u7cy2H_w3D08_GubhEL-Jpbdusjkc';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allProducts = [];
    let cart = JSON.parse(localStorage.getItem('royal_bakery_cart')) || {};
    let storeSettings = { whatsapp_number: '967783409904', is_open: true, closing_message: 'المحل مغلق حالياً.' };
    let userLocationUrl = ""; 

    window.onload = async () => {
        loadUserData();
        await fetchSettings();
        await fetchCategories();
        fetchProducts();
    };

    function closeCartOnOverlay(e) { if(e.target.id === 'cartModal') toggleModal(); }

    async function fetchSettings() {
        try {
            const { data } = await _supabase.from('store_settings').select('*').limit(1).single();
            if (data) {
                storeSettings = data;
                if (storeSettings.is_open === false) {
                    document.getElementById('closed-reason').innerText = storeSettings.closing_message;
                    document.getElementById('closed-overlay').style.display = 'flex';
                }
            }
        } catch (e) { console.error(e); }
    }

    async function fetchCategories() {
        try {
            const { data } = await _supabase.from('categories').select('*').order('id');
            if (data) {
                const nav = document.getElementById('catNav');
                data.forEach(cat => {
                    nav.innerHTML += `<button class="cat-btn" onclick="filterProducts('${cat.slug}', this)">${cat.icon || ''} ${cat.name}</button>`;
                });
            }
        } catch (e) { console.error(e); }
    }

    async function fetchProducts() {
    try {
        const { data, error } = await _supabase
            .from('products')
            .select('*')
            .order('priority', { ascending: true }); // الترتيب من الرقم الأصغر إلى الأكبر

        if (error) throw error;

        if (data) {
            allProducts = data;
            document.getElementById('loading').style.display = 'none';
            document.getElementById('status-dot').style.background = '#2ecc71';
            renderProducts('all');
            updateUI();
        }
    } catch (e) { 
        console.error("Error fetching products:", e);
        document.getElementById('loading').innerText = "خطأ في التحميل، يرجى المحاولة لاحقاً"; 
    }
}


    function renderProducts(category) {
        const container = document.getElementById('products');
        const filtered = category === 'all' ? allProducts : allProducts.filter(p => p.type === category);
        
        container.innerHTML = filtered.map(p => {
            const isAvailable = p.is_available !== false;
            const stars = "⭐".repeat(p.rating || 5);
            return `
            <div class="card ${!isAvailable ? 'unavailable' : ''}">
                ${!isAvailable ? `<div class="unavailable-tag"><div class="reason-box">${p.unavailable_reason || 'نفذت الكمية'}</div></div>` : ''}
                <img src="${p.img}" class="product-img" onclick="openImageViewer('${p.img}')">
                <div class="product-title">${p.name}</div>
                <div class="rating">${stars}</div>
                <div class="product-price">${p.price} ريال</div>
                <button class="add-btn" onclick="addToCart(${p.id})" ${!isAvailable ? 'disabled style="background: #ccc; box-shadow:none;"' : ''}>
                    ${isAvailable ? 'أضف للسلة +' : 'غير متوفر حالياً'}
                </button>
            </div>`;
        }).join('');
    }

    function getLocation() {
        const btn = document.getElementById('getLocBtn');
        if (navigator.geolocation) {
            btn.innerText = "⏳ جاري التحديد...";
            btn.classList.remove('pulse-animation'); // إيقاف الوميض عند البدء
            navigator.geolocation.getCurrentPosition((pos) => {
                userLocationUrl = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                btn.innerText = "✅ تم تحديد موقعك بنجاح";
                btn.classList.add('success');
            }, () => { 
                alert("يرجى تفعيل GPS"); 
                btn.innerText = "📍 اضغط هنا لتحديد موقعك GPS";
                btn.classList.add('pulse-animation'); // إعادة الوميض في حال الفشل
            });
        }
    }

    function addToCart(id) {
        const item = allProducts.find(x => x.id === id);
        if (cart[id]) cart[id].qty++; else cart[id] = { ...item, qty: 1 };
        updateUI();
    }

    function updateUI() {
        let count = 0, total = 0;
        const list = document.getElementById('cartItemsList');
        list.innerHTML = '';
        for (let id in cart) {
            count += cart[id].qty; total += (cart[id].qty * cart[id].price);
            list.innerHTML += `
            <div style="display:flex; justify-content:space-between; align-items:center; padding:15px 0; border-bottom:1px solid #f9f9f9;">
                <div><b>${cart[id].name}</b><br><small>${cart[id].price} ريال</small></div>
                <div style="display:flex; align-items:center; gap:10px;">
                    <button style="width:25px; height:25px; border-radius:5px; border:1px solid #ddd;" onclick="changeQty(${id}, -1)">-</button>
                    <span>${cart[id].qty}</span>
                    <button style="width:25px; height:25px; border-radius:5px; border:1px solid #ddd;" onclick="changeQty(${id}, 1)">+</button>
                    <button style="color:red; border:none; background:none; font-size:18px;" onclick="removeItem(${id})">×</button>
                </div>
            </div>`;
        }
        document.getElementById('nav-count').innerText = count;
        document.getElementById('nav-total').innerText = total;
        document.getElementById('modalTotal').innerText = total;
        localStorage.setItem('royal_bakery_cart', JSON.stringify(cart));
    }

    function changeQty(id, d) { cart[id].qty += d; if(cart[id].qty<=0) delete cart[id]; updateUI(); }
    function removeItem(id) { delete cart[id]; updateUI(); }
    function clearCart() { cart = {}; updateUI(); }
    function toggleModal() { const m = document.getElementById('cartModal'); m.style.display = (m.style.display==='flex')?'none':'flex'; }
    function openImageViewer(s) { document.getElementById('fullImage').src=s; document.getElementById('imageViewer').style.display='flex'; }
    function closeImageViewer() { document.getElementById('imageViewer').style.display='none'; }
    function filterProducts(t, b) { document.querySelectorAll('.cat-btn').forEach(x=>x.classList.remove('active')); b.classList.add('active'); renderProducts(t); }
    function saveUserData() { localStorage.setItem('royal_bakery_user', JSON.stringify({name:document.getElementById('custName').value, phone:document.getElementById('custPhone').value})); }
    function loadUserData() { const d = JSON.parse(localStorage.getItem('royal_bakery_user')); if(d){document.getElementById('custName').value=d.name||''; document.getElementById('custPhone').value=d.phone||'';}}

    async function handleOrder() {
        const name = document.getElementById('custName').value.trim();
        const total = document.getElementById('modalTotal').innerText;
        if(!name || !userLocationUrl || Object.keys(cart).length === 0) return alert("اكمل البيانات والموقع 📍");
        
        const btn = document.getElementById('sendOrderBtn');
        btn.disabled = true; btn.innerText = "جاري الإرسال...";
        
        try {
            await _supabase.from('orders').insert([{ customer_name: name, location_url: userLocationUrl, items: cart, total_price: parseFloat(total), notes: document.getElementById('orderNotes').value }]);
            let msg = `*🧾 طلب جديد - المخبز الملكي*%0A*الاسم:* ${name}%0A*الموقع:* ${userLocationUrl}%0A*الطلبات:*%0A`;
            for(let id in cart) msg += `- ${cart[id].name} (x${cart[id].qty})%0A`;
            msg += `*الإجمالي:* ${total} ريال`;
            window.open(`https://wa.me/${storeSettings.whatsapp_number}?text=${msg}`, '_blank');
            cart={}; updateUI(); toggleModal();
        } catch(e) { alert("خطأ في الإرسال"); } finally { btn.disabled=false; btn.innerText="تأكيد الطلب عبر الواتساب 💬"; }
    }
</script>
</body>
</html>
