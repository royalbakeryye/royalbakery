<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Royal Bakery | المخبز الملكي</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #fdfaf5;
            --primary-orange: #f38230;
            --dark-black: #1a1a1a;
            --white: #ffffff;
            --gold: #d4a017;
            --whatsapp-green: #25d366;
            --red: #e74c3c;
            --gray: #f0f0f0;
            --soft-shadow: 0 10px 30px rgba(0,0,0,0.08);
            --luxury-gradient: linear-gradient(135deg, #f38230 0%, #d4a017 100%);
        }

        body {
            margin: 0; background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding-bottom: 120px; color: var(--dark-black);
            -webkit-tap-highlight-color: transparent;
        }

        header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px); padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 2px 20px rgba(0,0,0,0.03);
            position: sticky; top: 0; z-index: 1000;
        }

        .header-brand { display: flex; align-items: center; gap: 10px; }
        .logo { font-size: 20px; font-weight: 900; color: var(--dark-black); letter-spacing: 1px; }
        .logo span { color: var(--gold); }

        .closed-status-tag {
            background: #fff0f0; color: var(--red); padding: 4px 12px;
            border-radius: 12px; font-size: 12px; font-weight: bold;
            border: 1px solid #ffebeb; display: none; animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

        .categories-nav {
            display: flex; gap: 12px; padding: 15px; overflow-x: auto;
            background: var(--white); border-bottom: 1px solid #f0f0f0;
            position: sticky; top: 60px; z-index: 999; scrollbar-width: none;
        }
        .categories-nav::-webkit-scrollbar { display: none; }

        .cat-btn {
            background: #fff; border: 1px solid #eee; padding: 10px 25px;
            border-radius: 50px; cursor: pointer; white-space: nowrap; 
            font-weight: 600; transition: 0.4s; font-size: 14px;
        }
        .cat-btn.active { 
            background: var(--luxury-gradient); color: white; 
            border-color: transparent; box-shadow: 0 8px 15px rgba(243, 130, 48, 0.3); 
        }

        .products-container {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 20px; padding: 20px; max-width: 1100px; margin: 0 auto;
        }

        .card {
            background: var(--white); border-radius: 25px; padding: 15px;
            text-align: center; box-shadow: var(--soft-shadow);
            transition: all 0.3s ease; border: 1px solid rgba(0,0,0,0.02);
            position: relative; overflow: hidden;
        }
        .card:hover { transform: translateY(-8px); box-shadow: 0 15px 35px rgba(0,0,0,0.12); }

        .product-img { width: 100%; height: 140px; object-fit: cover; border-radius: 20px; background: #fdfdfd; cursor: zoom-in; transition: 0.3s; }
        .product-title { font-weight: 700; margin: 12px 0 15px; font-size: 15px; color: #333; }
        .product-price { color: var(--primary-orange); font-weight: 800; margin-bottom: 12px; font-size: 18px; }

        .unavailable-tag {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.4);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 5; border-radius: 25px; pointer-events: none;
        }
        .reason-box { background: var(--red); color: white; padding: 5px 12px; border-radius: 8px; font-size: 12px; font-weight: bold; margin-top: 5px; }

        .add-btn {
            background: var(--luxury-gradient); color: white; border: none;
            width: 100%; padding: 12px; border-radius: 15px; cursor: pointer; font-weight: bold;
            transition: 0.3s; box-shadow: 0 5px 15px rgba(243, 130, 48, 0.2);
        }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(5px);
            z-index: 2000; justify-content: center; align-items: flex-end;
        }

        .modal-content {
            background: white; width: 100%; max-width: 500px; border-radius: 35px 35px 0 0;
            padding: 30px; max-height: 85vh; overflow-y: auto; animation: slideUp 0.4s ease-out;
        }

        .phone-input-container {
            display: flex; align-items: center; background: #f9f9f9;
            border: 2px solid #eee; border-radius: 16px; direction: ltr;
        }
        .country-prefix { display: flex; align-items: center; gap: 8px; padding: 0 15px; border-right: 2px solid #eee; font-weight: 800; }
        .phone-input-container input { border: none; padding: 15px; outline: none; width: 100%; font-size: 18px; font-weight: bold; background: transparent; }

        .bottom-nav {
            position: fixed; bottom: 20px; left: 20px; right: 20px; 
            background: var(--dark-black); border-radius: 25px;
            display: flex; justify-content: space-between; align-items: center; 
            padding: 15px 25px; z-index: 1500;
        }

        #imageViewer {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 3000; justify-content: center; align-items: center;
        }
        #fullImage { max-width: 90%; max-height: 80%; border-radius: 15px; border: 3px solid white; }

        .location-btn {
            width: 100%; background: #fef2f2; color: var(--red); border: 2px dashed var(--red); 
            padding: 15px; border-radius: 15px; margin: 15px 0; cursor: pointer; font-weight: bold;
            transition: 0.3s;
        }
        .location-btn.success { background: #f0fdf4; color: #166534; border-style: solid; border-color: #166534; }
        #status-dot { width: 10px; height: 10px; border-radius: 50%; background: #bbb; }

        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    </style>
</head>
<body>

<header>
    <div class="header-brand">
        <div class="logo">ROYAL <span>BAKERY</span> 👑</div>
        <div id="store-closed-msg" class="closed-status-tag"></div>
    </div>
    <div id="status-dot"></div>
</header>

<div class="categories-nav" id="catNav">
    <button class="cat-btn active" onclick="filterProducts('all', this)">✨ الكل</button>
</div>

<div id="loading" style="text-align:center; padding: 100px 0;">
    <div style="color: var(--gold); font-size: 18px; font-weight: bold;">جاري تحضير القائمة الملكية...</div>
</div>

<div class="products-container" id="products"></div>

<div id="imageViewer" onclick="closeImageViewer()">
    <img id="fullImage" src="">
</div>

<div class="bottom-nav">
    <div style="color: white;">الإجمالي: <span id="nav-total" style="color: var(--gold); font-weight: bold; font-size: 20px;">0</span> <small>ريال</small></div>
    <div onclick="toggleModal()" style="color: white; cursor: pointer; font-weight: bold; background: var(--luxury-gradient); padding: 12px 25px; border-radius: 18px;">
        🛒 السلة (<span id="nav-count">0</span>)
    </div>
</div>

<div id="cartModal" class="modal" onclick="closeCartOnOverlay(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h3 style="margin: 0; font-size: 22px;">سلة المشتريات 🛒</h3>
            <button onclick="toggleModal()" style="font-size: 32px; border: none; background: none; color: #ddd; cursor: pointer;">×</button>
        </div>
        
        <div id="cartItemsList"></div>

        <div style="margin-top: 25px;">
            <div class="phone-input-container">
                <div class="country-prefix"><img src="https://flagcdn.com/w40/ye.png" width="24"><span>+967</span></div>
                <input type="tel" id="custPhone" placeholder="7XXXXXXXX" oninput="validatePhone(this); saveUserData();" maxlength="9">
            </div>
            <button id="getLocBtn" onclick="getLocation()" class="location-btn">📍 تحديد موقعك GPS</button>
            <textarea id="orderNotes" style="width: 100%; height: 60px; padding: 10px; border-radius: 10px; border: 1px solid #eee; outline: none; margin-bottom:15px;" placeholder="أي ملاحظات إضافية؟"></textarea>
        </div>

        <div style="background: #fff9f5; padding: 20px; border-radius: 20px; margin: 20px 0; text-align: center; border: 1px solid #ffe0cc;">
            <div style="color: #2e7d32; font-weight: bold; font-size: 14px; margin-bottom: 8px;">🛵 التوصيل مجاني للجميع!</div>
            <span style="font-size: 20px; font-weight: 800;">الإجمالي: <span id="modalTotal" style="color:var(--primary-orange);">0</span> ريال</span>
        </div>

        <button id="sendOrderBtn" onclick="handleOrder()" style="background: var(--whatsapp-green); color: white; border: none; width: 100%; padding: 18px; border-radius: 20px; font-size: 18px; font-weight: bold; cursor: pointer;">تأكيد الطلب عبر الواتساب 💬</button>
        <button onclick="clearCart()" style="width: 100%; background: none; border: none; color: var(--red); margin-top: 20px; cursor: pointer; font-weight: 600;">🗑️ تفريغ السلة</button>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://gemnsdsexkbyfdpozcwu.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdlbW5zZHNleGtieWZkcG96Y3d1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY3NDgzNzcsImV4cCI6MjA4MjMyNDM3N30.QQt3zYL5rF4kr1u7cy2H_w3D08_GubhEL-Jpbdusjkc';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allProducts = [];
    let cart = JSON.parse(localStorage.getItem('royal_bakery_cart')) || {};
    let storeSettings = { is_open: true };
    let userLocationUrl = ""; 

    window.onload = async () => {
        loadUserData();
        await fetchSettings();
        await fetchCategories();
        fetchProducts();
    };

    async function fetchSettings() {
        try {
            const { data } = await _supabase.from('store_settings').select('*').limit(1).single();
            if (data) {
                storeSettings = data;
                const statusDot = document.getElementById('status-dot');
                const closedMsg = document.getElementById('store-closed-msg');
                if (!storeSettings.is_open) {
                    statusDot.style.background = '#e74c3c';
                    closedMsg.innerText = storeSettings.closing_message;
                    closedMsg.style.display = 'inline-block';
                } else {
                    statusDot.style.background = '#2ecc71';
                }
            }
        } catch (e) { }
    }

    async function fetchCategories() {
        try {
            const { data } = await _supabase.from('categories').select('*').order('priority', { ascending: true });
            if (data) {
                const nav = document.getElementById('catNav');
                nav.innerHTML = '<button class="cat-btn active" onclick="filterProducts(\'all\', this)">✨ الكل</button>';
                data.forEach(cat => {
                    nav.innerHTML += `<button class="cat-btn" onclick="filterProducts('${cat.slug}', this)">${cat.icon || ''} ${cat.name}</button>`;
                });
            }
        } catch (e) { }
    }

    async function fetchProducts() {
        try {
            const { data } = await _supabase.from('products').select('*').order('priority', { ascending: true });
            if (data) {
                allProducts = data;
                document.getElementById('loading').style.display = 'none';
                renderProducts('all');
                updateUI();
            }
        } catch (e) { }
    }

    function renderProducts(category) {
        const container = document.getElementById('products');
        const filtered = category === 'all' ? allProducts : allProducts.filter(p => p.type === category);
        container.innerHTML = filtered.map(p => {
            const isAvailable = p.is_available !== false;
            return `
            <div class="card ${!isAvailable ? 'unavailable' : ''}">
                ${!isAvailable ? `<div class="unavailable-tag"><div class="reason-box">${p.unavailable_reason || 'نفذت'}</div></div>` : ''}
                <img src="${p.img}" class="product-img" onclick="openImageViewer('${p.img}')">
                <div class="product-title">${p.name}</div>
                <div class="product-price">${p.price} ريال</div>
                <button class="add-btn" onclick="addToCart(${p.id})" ${!isAvailable ? 'disabled style="background: #ccc;"' : ''}>
                    ${isAvailable ? 'أضف للسلة +' : 'غير متوفر'}
                </button>
            </div>`;
        }).join('');
    }

    function validatePhone(input) {
        input.value = input.value.replace(/[^0-9]/g, '');
        if (input.value.length > 0 && input.value[0] !== '7') { input.value = ''; alert("يجب أن يبدأ بـ 7"); }
    }

    function addToCart(id) {
        if(!storeSettings.is_open) return alert("المحل مغلق حالياً");
        const item = allProducts.find(x => x.id === id);
        if (cart[id]) cart[id].qty++; else cart[id] = { ...item, qty: 1 };
        updateUI();
    }

    function updateUI() {
        let count = 0, total = 0;
        const list = document.getElementById('cartItemsList');
        list.innerHTML = '';
        for (let id in cart) {
            count += cart[id].qty; total += (cart[id].qty * cart[id].price);
            list.innerHTML += `<div style="display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid #f9f9f9;">
                <div><b>${cart[id].name}</b><br><small>${cart[id].price} ريال</small></div>
                <div style="display:flex; align-items:center; gap:10px;">
                    <button style="width:30px; height:30px; border-radius:10px; border:1px solid #ddd; background:#fff;" onclick="changeQty(${id}, -1)">-</button>
                    <span style="font-weight:bold;">${cart[id].qty}</span>
                    <button style="width:30px; height:30px; border-radius:10px; border:1px solid #ddd; background:#fff;" onclick="changeQty(${id}, 1)">+</button>
                </div>
            </div>`;
        }
        document.getElementById('nav-count').innerText = count;
        document.getElementById('nav-total').innerText = total;
        document.getElementById('modalTotal').innerText = total;
        localStorage.setItem('royal_bakery_cart', JSON.stringify(cart));
    }

    function changeQty(id, d) { cart[id].qty += d; if(cart[id].qty<=0) delete cart[id]; updateUI(); }
    function clearCart() { cart = {}; updateUI(); }
    function toggleModal() { const m = document.getElementById('cartModal'); m.style.display = (m.style.display==='flex')?'none':'flex'; }
    function closeCartOnOverlay(e) { if(e.target.id === 'cartModal') toggleModal(); }
    function openImageViewer(s) { document.getElementById('fullImage').src=s; document.getElementById('imageViewer').style.display='flex'; }
    function closeImageViewer() { document.getElementById('imageViewer').style.display='none'; }
    function filterProducts(t, b) { document.querySelectorAll('.cat-btn').forEach(x=>x.classList.remove('active')); b.classList.add('active'); renderProducts(t); }
    function saveUserData() { localStorage.setItem('royal_bakery_user_phone', document.getElementById('custPhone').value); }
    function loadUserData() { document.getElementById('custPhone').value = localStorage.getItem('royal_bakery_user_phone') || ''; }

    function getLocation() {
    const btn = document.getElementById('getLocBtn');
    if (navigator.geolocation) {
        btn.innerText = "⏳ جاري التحديد...";
        navigator.geolocation.getCurrentPosition((pos) => {
            // تصحيح الرابط هنا
            userLocationUrl = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
            btn.innerText = "✅ تم تحديد موقعك";
            btn.classList.add('success');
        }, () => { 
            alert("يرجى تفعيل الـ GPS ومنح الإذن للمتصفح"); 
            btn.innerText = "📍 تحديد موقعك GPS"; 
        });
    }
}


    async function handleOrder() {
    if(!storeSettings.is_open) return alert("نعتذر، المحل مغلق");
    
    const phone = document.getElementById('custPhone').value.trim();
    const total = document.getElementById('modalTotal').innerText;
    const notes = document.getElementById('orderNotes').value.trim();
    
    if(phone.length < 9 || !userLocationUrl || Object.keys(cart).length === 0) {
        return alert("يرجى إكمال البيانات: رقم الهاتف، تحديد الموقع، وإضافة منتجات للسلة");
    }

    // 1. بناء قائمة المنتجات بشكل منظم
    let itemsList = "";
    for (let id in cart) {
        let item = cart[id];
        itemsList += `🔸 *${item.name}* \n   الكمية: (${item.qty}) | السعر: ${item.qty * item.price} ريال\n`;
    }

    // 2. صياغة الرسالة النهائية بتنسيق احترافي
    let message = `*👑 طلب جديد - المخبز الملكي 👑*
------------------------------
*📞 رقم العميل:*
+967${phone}

*📦 الطلبات:*
${itemsList}
------------------------------
*💰 الإجمالي النهائي:* ${total} ريال
*🚚 التوصيل:* مجاني

*📍 موقع التوصيل (GPS):*
${userLocationUrl}

${notes ? `*📝 ملاحظات إضافية:* \n${notes}` : ''}

*شكراً لاختيارك المخبز الملكي! ✨*`;

    try {
        // حفظ في قاعدة البيانات
        await _supabase.from('orders').insert([{ 
            phone: "+967" + phone, 
            location_url: userLocationUrl, 
            items: cart, 
            total_price: parseFloat(total), 
            notes: notes 
        }]);

        // فتح واتساب بالرسالة المنسقة
        const whatsappUrl = `https://wa.me/${storeSettings.whatsapp_number}?text=${encodeURIComponent(message)}`;
        window.open(whatsappUrl, '_blank');
        
        // تنظيف السلة
        cart = {}; 
        updateUI(); 
        toggleModal();
        
    } catch(e) { 
        alert("حدث خطأ أثناء إرسال الطلب، يرجى المحاولة لاحقاً"); 
    }
}

</script>
</body>
</html>
